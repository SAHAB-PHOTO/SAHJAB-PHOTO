<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إتمام الدفع — أكاديمية سهاب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📸</text></svg>" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main>
    <div class="container checkout-grid" id="checkoutWrap">
      <div>
        <h1 style="font-size:1.5rem;margin-bottom:8px">إتمام الدفع 🔒</h1>
        <p style="color:var(--text-2);margin-bottom:28px">بيئة تجريبية: لن يتم خصم أي مبلغ حقيقي. في الإنتاج تُستبدل هذه الصفحة ببوابة دفع فعلية (Stripe / PayPal / مدفوعات محلية).</p>

        <h3 style="margin-bottom:14px">اختر وسيلة الدفع</h3>
        <div class="pay-methods" id="payMethods"></div>

        <div id="cardForm">
          <div class="form-field">
            <label>الاسم على البطاقة</label>
            <input type="text" id="cardName" placeholder="AHMAD ALMUSAWWER" dir="ltr" />
          </div>
          <div class="form-field">
            <label>رقم البطاقة</label>
            <input type="text" id="cardNumber" placeholder="4242 4242 4242 4242" dir="ltr" inputmode="numeric" maxlength="19" />
            <div class="form-hint">استخدم 4242 4242 4242 4242 للتجربة</div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            <div class="form-field">
              <label>تاريخ الانتهاء</label>
              <input type="text" id="cardExp" placeholder="MM/YY" dir="ltr" maxlength="5" />
            </div>
            <div class="form-field">
              <label>رمز الأمان CVC</label>
              <input type="text" id="cardCvc" placeholder="123" dir="ltr" inputmode="numeric" maxlength="4" />
            </div>
          </div>
        </div>
        <div class="form-error" id="err"></div>
        <button class="btn btn-gold btn-lg btn-block" id="payBtn">ادفع الآن</button>
        <div class="secure-note">🔒 اتصال مشفّر SSL — بياناتك محمية بالكامل · ضمان استرداد 14 يومًا</div>
      </div>

      <aside class="order-card" id="orderCard"></aside>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    renderNav();
    renderFooter();

    const user = requireAuth();

    // تحديد المنتج: دورة فردية أو باقة اشتراك
    const courseId = qs("course");
    const planId = qs("plan");
    const course = courseId ? getCourse(courseId) : null;
    const plan = planId ? PLANS.find(p => p.id === planId) : null;

    if (!course && !plan) location.href = "pricing.html";
    if (course && Enroll.isEnrolled(user, course.id)) location.href = "course.html?id=" + course.id;

    const title = course ? course.title : plan.name;
    const amount = course ? course.price : plan.price;
    document.getElementById("orderCard").innerHTML = `
      <h3 style="margin-bottom:16px">ملخص الطلب</h3>
      ${course ? `
        <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">
          <div class="e-thumb" style="width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-size:1.7rem;background:linear-gradient(140deg,${course.gradient[0]},${course.gradient[1]})">${course.icon}</div>
          <div><b style="font-size:0.95rem">${course.title}</b><div style="color:var(--text-3);font-size:0.8rem">${course.lessonsCount} درسًا · ${course.hours} ساعة · وصول مدى الحياة</div></div>
        </div>` : `
        <div style="margin-bottom:16px"><b>${plan.name}</b><div style="color:var(--text-3);font-size:0.82rem">${plan.desc}</div></div>`}
      <div class="order-line"><span>${title}</span><span>$${amount}</span></div>
      ${course && course.oldPrice ? `<div class="order-line"><span>خصم إطلاق</span><span style="color:var(--green)">-$${course.oldPrice - course.price}</span></div>` : ""}
      <div class="order-line"><span>الضريبة</span><span>$0</span></div>
      <div class="order-line total"><span>الإجمالي</span><span style="color:var(--gold-2)">$${amount}</span></div>`;

    // وسائل الدفع
    const methods = [
      { id: "card", label: "💳 بطاقة ائتمان" },
      { id: "paypal", label: "🅿️ PayPal" },
      { id: "applepay", label: " Apple Pay" },
      { id: "googlepay", label: "🇬 Google Pay" },
    ];
    let method = "card";
    const pmBox = document.getElementById("payMethods");
    function renderMethods() {
      pmBox.innerHTML = methods.map(m => `<div class="pay-method ${m.id === method ? "selected" : ""}" data-id="${m.id}">${m.label}</div>`).join("");
      pmBox.querySelectorAll(".pay-method").forEach(el => el.addEventListener("click", () => {
        method = el.dataset.id;
        document.getElementById("cardForm").style.display = method === "card" ? "block" : "none";
        renderMethods();
      }));
    }
    renderMethods();

    // تنسيق حقول البطاقة
    document.getElementById("cardNumber").addEventListener("input", e => {
      e.target.value = e.target.value.replace(/\D/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
    });
    document.getElementById("cardExp").addEventListener("input", e => {
      let v = e.target.value.replace(/\D/g, "").slice(0, 4);
      e.target.value = v.length > 2 ? v.slice(0, 2) + "/" + v.slice(2) : v;
    });

    document.getElementById("payBtn").addEventListener("click", () => {
      const err = document.getElementById("err");
      err.classList.remove("show");
      if (method === "card") {
        const num = document.getElementById("cardNumber").value.replace(/\s/g, "");
        if (!document.getElementById("cardName").value.trim() || num.length !== 16 ||
            !/^\d{2}\/\d{2}$/.test(document.getElementById("cardExp").value) ||
            document.getElementById("cardCvc").value.length < 3) {
          err.textContent = "يرجى إكمال بيانات البطاقة بشكل صحيح.";
          err.classList.add("show");
          return;
        }
      }
      const btn = document.getElementById("payBtn");
      btn.disabled = true;
      btn.textContent = "جارٍ معالجة الدفع…";
      setTimeout(() => {
        if (course) Payments.purchaseCourse(user, course, method);
        else Payments.subscribe(user, plan.id, method);
        document.getElementById("checkoutWrap").innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:70px 20px">
            <div style="font-size:4rem">🎉</div>
            <h1 style="margin:16px 0 10px">تم الدفع بنجاح!</h1>
            <p style="color:var(--text-2);max-width:480px;margin:0 auto 30px">
              ${course ? `أصبحت دورة «${course.title}» ملكك مدى الحياة. ابدأ التعلم الآن!` : `تم تفعيل ${plan.name} — كامل مكتبة الأكاديمية بين يديك.`}
              <br /><small style="color:var(--text-3)">رقم الفاتورة متاح في لوحة التحكم → المدفوعات</small>
            </p>
            <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
              ${course ? `<a href="lesson.html?course=${course.id}&m=0&l=0" class="btn btn-gold btn-lg">ابدأ الدرس الأول</a>` : `<a href="courses.html" class="btn btn-gold btn-lg">تصفّح المكتبة</a>`}
              <a href="dashboard.html" class="btn btn-outline btn-lg">لوحة التحكم</a>
            </div>
          </div>`;
      }, 1400);
    });
  </script>
</body>
</html>
