<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم — أكاديمية سهاب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📸</text></svg>" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main>
    <div class="container dash-layout">
      <aside class="dash-side">
        <div class="dash-user" id="dashUser"></div>
        <ul class="dash-nav" id="dashNav"></ul>
      </aside>
      <section class="dash-panel" id="dashPanel"></section>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    renderNav();
    renderFooter();
    const user = requireAuth();
    if (!user) throw new Error("redirect");

    document.getElementById("dashUser").innerHTML = `
      <span class="avatar">${initials(user.name)}</span>
      <b>${user.name}</b>
      <span>${user.email}</span>
      ${user.subscription && user.subscription.active ? '<div style="margin-top:8px"><span class="badge-pill" style="font-size:0.72rem;padding:3px 12px">⭐ مشترك ' + (user.subscription.plan === "yearly" ? "سنوي" : "شهري") + '</span></div>' : ""}`;

    const tabs = [
      { id: "courses", icon: "🎓", label: "دوراتي" },
      { id: "certs", icon: "🏅", label: "شهاداتي" },
      { id: "billing", icon: "💳", label: "الاشتراك والمدفوعات" },
      { id: "profile", icon: "⚙️", label: "الملف الشخصي" },
    ];
    let active = "courses";

    function renderNavTabs() {
      document.getElementById("dashNav").innerHTML = tabs.map(t =>
        `<li><button class="${t.id === active ? "active" : ""}" data-id="${t.id}">${t.icon} ${t.label}</button></li>`
      ).join("") + `<li><button data-id="logout" style="color:var(--red)">🚪 تسجيل الخروج</button></li>`;
      document.querySelectorAll(".dash-nav button").forEach(b => b.addEventListener("click", () => {
        if (b.dataset.id === "logout") { Auth.logout(); return; }
        active = b.dataset.id;
        renderNavTabs(); renderPanel();
      }));
    }

    function enrolledCourses() {
      const ids = user.subscription && user.subscription.active
        ? COURSES.map(c => c.id)
        : user.enrollments;
      // مع الاشتراك: نظهر الدورات التي بدأ فيها فعلًا + المسجل بها شراءً
      return COURSES.filter(c => ids.includes(c.id))
        .filter(c => user.enrollments.includes(c.id) || Enroll.courseProgress(user, c) > 0 || !(user.subscription && user.subscription.active))
        .concat((user.subscription && user.subscription.active) ? [] : [])
        .filter((c, i, arr) => arr.indexOf(c) === i);
    }

    function renderPanel() {
      const panel = document.getElementById("dashPanel");

      if (active === "courses") {
        const list = user.subscription && user.subscription.active
          ? COURSES.filter(c => user.enrollments.includes(c.id) || Enroll.courseProgress(user, c) > 0)
          : COURSES.filter(c => user.enrollments.includes(c.id));
        const totalDone = Object.keys(user.progress).length;
        const hours = list.reduce((n, c) => n + c.hours, 0);
        panel.innerHTML = `
          <h1>دوراتي 🎓</h1>
          <div class="stats-row">
            <div class="stat-card"><b>${list.length}</b><span>دورة ${user.subscription && user.subscription.active ? "قيد التعلم" : "مسجّلة"}</span></div>
            <div class="stat-card"><b>${totalDone}</b><span>درسًا مكتملًا</span></div>
            <div class="stat-card"><b>${user.certificates.length}</b><span>شهادة</span></div>
            <div class="stat-card"><b>${hours}</b><span>ساعة محتوى</span></div>
          </div>
          ${user.subscription && user.subscription.active ? `<p style="color:var(--text-2);margin-bottom:18px">⭐ اشتراكك يفتح <a href="courses.html" style="color:var(--gold-2)">كامل مكتبة الأكاديمية</a> — ابدأ أي دورة وستظهر هنا.</p>` : ""}
          ${list.length === 0 ? `
            <div class="empty-state">
              <div class="big">📷</div>
              <p>لم تسجّل في أي دورة بعد.<br />ابدأ بدورة الأساسيات المجانية!</p>
              <a href="course.html?id=fundamentals" class="btn btn-gold" style="margin-top:18px">ابدأ الدورة المجانية</a>
            </div>` :
            list.map(c => {
              const p = Enroll.courseProgress(user, c);
              return `
              <div class="enrolled-card">
                <div class="e-thumb" style="background:linear-gradient(140deg,${c.gradient[0]},${c.gradient[1]})">${c.icon}</div>
                <div class="e-info">
                  <h3><a href="course.html?id=${c.id}">${c.title}</a></h3>
                  <div class="progress-bar"><div class="fill" style="width:${p}%"></div></div>
                  <span style="font-size:0.78rem;color:var(--text-3)">${p}% مكتمل</span>
                </div>
                <a href="lesson.html?course=${c.id}&m=0&l=0" class="btn ${p === 100 ? "btn-ghost" : "btn-gold"} btn-sm">${p === 100 ? "مراجعة" : p > 0 ? "متابعة" : "ابدأ"}</a>
              </div>`;
            }).join("")}`;
      }

      if (active === "certs") {
        panel.innerHTML = `
          <h1>شهاداتي 🏅</h1>
          ${user.certificates.length === 0 ? `
            <div class="empty-state">
              <div class="big">🏅</div>
              <p>لا شهادات بعد — أكمل جميع دروس واختبارات أي دورة (بنسبة نجاح 60%+) لتحصل على شهادتك الموثّقة.</p>
            </div>` :
            user.certificates.map(c => `
            <div class="cert-card">
              <div class="c-head">
                <div>
                  <h3>شهادة إتمام: ${c.courseTitle}</h3>
                  <span style="color:var(--text-3);font-size:0.85rem">صدرت في ${UI.fmtDate(c.issuedAt)}</span>
                  <div class="c-code">رمز التحقق: ${c.code}</div>
                </div>
                <button class="btn btn-gold btn-sm" data-view="${c.code}">عرض وطباعة</button>
              </div>
              <div id="certView-${c.code}" style="display:none;margin-top:26px">
                <div class="certificate">
                  <div class="c-logo">📸</div>
                  <h2>أكاديمية سهاب للتصوير الفوتوغرافي</h2>
                  <p style="color:var(--text-3)">تشهد بأن</p>
                  <div class="c-name">${user.name}</div>
                  <p style="color:var(--text-3)">قد أتمّ بنجاح جميع متطلبات دورة</p>
                  <div class="c-course">«${c.courseTitle}»</div>
                  <p style="color:var(--text-2);font-size:0.9rem">شاملةً الدروس والاختبارات والمشاريع العملية</p>
                  <div class="c-foot">
                    <span>التاريخ: ${UI.fmtDate(c.issuedAt)}</span>
                    <span style="direction:ltr">${c.code}</span>
                    <span>المدير الأكاديمي</span>
                  </div>
                </div>
                <div style="text-align:center;margin-top:16px">
                  <button class="btn btn-outline btn-sm" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
                </div>
              </div>
            </div>`).join("")}`;
        panel.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => {
          const el = document.getElementById("certView-" + b.dataset.view);
          el.style.display = el.style.display === "none" ? "block" : "none";
        }));
      }

      if (active === "billing") {
        const sub = user.subscription;
        panel.innerHTML = `
          <h1>الاشتراك والمدفوعات 💳</h1>
          <div class="stat-card" style="margin-bottom:26px;padding:26px">
            ${sub && sub.active ? `
              <b style="font-size:1.2rem">⭐ ${sub.plan === "yearly" ? "الاشتراك السنوي" : "الاشتراك الشهري"} — نشط</b>
              <span>بدأ في ${UI.fmtDate(sub.started)} · يتجدد في ${UI.fmtDate(sub.ends)}</span>
              <div style="margin-top:16px"><button class="btn btn-outline btn-sm" id="cancelSub">إلغاء التجديد التلقائي</button></div>` : `
              <b style="font-size:1.2rem">لا يوجد اشتراك نشط</b>
              <span>اشترك لفتح كامل مكتبة الأكاديمية — أكثر من 12 دورة و300 درس.</span>
              <div style="margin-top:16px"><a href="pricing.html" class="btn btn-gold btn-sm">عرض الباقات</a></div>`}
          </div>
          <h3 style="margin-bottom:14px">سجل المدفوعات</h3>
          ${user.payments.length === 0 ? '<p style="color:var(--text-3)">لا مدفوعات بعد.</p>' :
            user.payments.slice().reverse().map(p => `
            <div class="enrolled-card" style="padding:16px 20px">
              <div class="e-info">
                <b style="font-size:0.95rem">${p.title}</b>
                <div style="color:var(--text-3);font-size:0.8rem">${UI.fmtDate(p.at)} · ${p.method === "card" ? "بطاقة ائتمان" : p.method} · <span style="direction:ltr;font-family:monospace">${p.ref}</span></div>
              </div>
              <b style="color:var(--gold-2);font-family:var(--font-head)">$${p.amount}</b>
            </div>`).join("")}`;
        const cancelBtn = document.getElementById("cancelSub");
        if (cancelBtn) cancelBtn.addEventListener("click", () => {
          Payments.cancelSubscription(user);
          UI.toast("تم إلغاء التجديد — يبقى اشتراكك فعالًا حتى نهاية المدة");
          renderPanel();
        });
      }

      if (active === "profile") {
        panel.innerHTML = `
          <h1>الملف الشخصي ⚙️</h1>
          <div class="auth-card" style="max-width:520px;box-shadow:none">
            <div class="form-field">
              <label>الاسم الكامل</label>
              <input type="text" id="pfName" value="${user.name}" />
            </div>
            <div class="form-field">
              <label>البريد الإلكتروني</label>
              <input type="email" value="${user.email}" disabled style="opacity:0.6" />
              <div class="form-hint">لا يمكن تغيير البريد الإلكتروني</div>
            </div>
            <div class="form-field">
              <label>عضو منذ</label>
              <input type="text" value="${UI.fmtDate(user.joined)}" disabled style="opacity:0.6" />
            </div>
            <button class="btn btn-gold" id="saveProfile">حفظ التغييرات</button>
          </div>`;
        document.getElementById("saveProfile").addEventListener("click", () => {
          const name = document.getElementById("pfName").value.trim();
          if (name.length < 3) { UI.toast("⚠️ يرجى إدخال اسم صحيح"); return; }
          user.name = name;
          Auth.save(user);
          UI.toast("✓ تم حفظ التغييرات");
          renderNav(); document.getElementById("dashUser").querySelector("b").textContent = name;
        });
      }
    }

    renderNavTabs();
    renderPanel();
  </script>
</body>
</html>
