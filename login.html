<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — أكاديمية سهاب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📸</text></svg>" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>أهلًا بعودتك 👋</h1>
        <p class="sub">سجّل دخولك لمتابعة رحلتك التعليمية</p>
        <div class="form-error" id="err"></div>
        <form id="loginForm" novalidate>
          <div class="form-field">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="you@example.com" required dir="ltr" style="text-align:right" />
          </div>
          <div class="form-field">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-gold btn-lg btn-block">تسجيل الدخول</button>
        </form>
        <p class="auth-alt">ليس لديك حساب؟ <a href="register.html">أنشئ حسابك مجانًا</a></p>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    renderNav();
    renderFooter();
    if (Auth.current()) location.href = "dashboard.html";

    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.classList.remove("show");
      try {
        Auth.login(
          document.getElementById("email").value.trim().toLowerCase(),
          document.getElementById("password").value
        );
        location.href = qs("next") || "dashboard.html";
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add("show");
      }
    });
  </script>
</body>
</html>
